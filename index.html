<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1626">
  <title>Padel Tournament Manager</title>
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('ptm.theme');
        document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
      } catch (e) { /* localStorage unavailable */ }
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"></div>

  <dialog id="confirm-dialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h2 class="dialog-title"></h2>
      <p class="dialog-message"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn btn-secondary dialog-cancel">Cancel</button>
        <button value="ok" class="btn btn-danger dialog-ok">OK</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
